events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    server {
        listen 10000;

        # 1. PHP Authentication (Handled by PHP-FPM)
        location ~ ^/api/auth/(.+\.php)$ {
            root /var/www/php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^/api/auth/(.+\.php)(.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/php/$fastcgi_path_info;
            fastcgi_param HTTPS on;
        }

        # 2. Python Stock Data & Alerts (Handled by FastAPI)
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check for Render
        location /health {
            return 200 'OK';
        }
    }
}
