events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 10000;

        # 1. PHP Authentication (Handled by PHP-FPM)
        location /api/auth/ {
            alias /var/www/php/;
            index login.php;
            
            location ~ \.php$ {
                include fastcgi_params;
                # Standard path for PHP 8.2 FPM socket on Debian/Ubuntu
                fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param HTTPS on;
            }
        }

        # 2. Python Stock Data & Alerts (Handled by FastAPI)
        location /api/ {
            proxy_pass http://127.0.0.1:8000; # No trailing slash preserves the /api prefix
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check for Render
        location /health {
            return 200 'OK';
        }
    }
}
